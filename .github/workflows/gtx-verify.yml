name: G.Tx verify generated output

on:
  push:
    branches:
      - 'gtx/**'
    paths:
      - 'gtx-out/**'
      - '.github/workflows/gtx-verify.yml'
  workflow_dispatch:

jobs:
  build-and-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Generated inventory
        run: |
          find gtx-out -type f | sort
          echo; cat gtx-out/db/SCHEMA_ANALYSIS.md || true

      - name: Build
        working-directory: gtx-out
        run: dotnet build GtxGenerated.csproj -c Release

      - name: Test (if any test project exists)
        working-directory: gtx-out
        run: |
          if ls tests/*.cs >/dev/null 2>&1; then
            dotnet test GtxGenerated.csproj -c Release --no-build --logger "console;verbosity=detailed"
          else
            echo "no tests yet - tests come from acceptance criteria in a later stage"
          fi

      # ---- MAINTAINABILITY GATES -------------------------------------------
      # The whole premise is that we re-implement in C#, not translate COBOL.
      # These make that a build failure rather than a promise. A .NET developer
      # must never need to read COBOL to maintain the output.

      - name: Gate - no COBOL storage vocabulary in generated code
        working-directory: gtx-out
        run: |
          if grep -rniE '\b(PIC +[SX9]|COMP-3|PACKED-DECIMAL|RECLN|FILLER|OCCURS|REDEFINES)\b' src/ db/*.sql ; then
            echo "::error::COBOL storage vocabulary found - the output is still COBOL-shaped"; exit 1
          fi
          echo "OK: no COBOL storage vocabulary"

      - name: Gate - no byte-layout concepts
        working-directory: gtx-out
        run: |
          if grep -rniE 'RecordLength|byte +offset|ReadOnlySpan<byte>|\boffset [0-9]+\b' src/ ; then
            echo "::error::byte-layout concepts found - target is PostgreSQL, not fixed-length records"; exit 1
          fi
          echo "OK: no byte-layout concepts"

      - name: Gate - no copybook-shaped type names
        working-directory: gtx-out
        run: |
          # e.g. Cvtra05yRecord, Cocom01yRecord - a copybook name is not a domain name
          if grep -rnE 'class +C[a-z]{4}[0-9]{2}[a-z]|record +C[a-z]{4}[0-9]{2}[a-z]' src/ ; then
            echo "::error::copybook-derived type name found"; exit 1
          fi
          echo "OK: no copybook-shaped type names"

      - name: Gate - no binary floating point on money
        working-directory: gtx-out
        run: |
          # Strip comments first: the design model writes notes like
          # "Money - decimal, never double", which are guidance, not violations.
          # Only a declaration or cast counts.
          if find src -name '*.cs' -print0 \
               | xargs -0 sed -E 's://.*::; s:/\*.*\*/::' \
               | grep -nE '(public|private|internal|protected)[[:space:]]+(double|float)[[:space:]]|\((double|float)\)' ; then
            echo "::error::binary floating point declaration found; money must be decimal"; exit 1
          fi
          echo "OK: no double/float declarations"

      - name: Gate - no API error payloads committed
        working-directory: gtx-out
        run: |
          if grep -rniE 'BadRequestError|invalid_request_error|credit balance is too low' . ; then
            echo "::error::provider error payload found in generated output"; exit 1
          fi
          echo "OK: no error payloads"

      # The most consequential gate: types are computed from the copybooks and the
      # design step may not change them. Added after the model silently turned an
      # alphanumeric TRAN-ID into a bigint, narrowed a varchar(50) to varchar(30),
      # dropped a column and invented another - none of which the gates above see.
      - name: Gate - conformance against derived facts
        working-directory: gtx-out
        run: |
          if [ ! -f CONFORMANCE.md ]; then
            echo "::error::CONFORMANCE.md missing - the conformance gate did not run"; exit 1
          fi
          cat CONFORMANCE.md
          # The emitter classifies every finding itself: a derived fact with a
          # citation, an architectural choice, or a blocking defect. Trust its
          # verdict instead of re-deriving it here from section headings that drift.
          if grep -q '^\*\*Status: BLOCKING' CONFORMANCE.md; then
            echo "::error::blocking conformance findings - see CONFORMANCE.md"
            sed -n '/^## \xe2\x9b\x94/,/^$/p' CONFORMANCE.md || true
            exit 1
          fi
          echo "OK: types match the copybooks; keys, dates and liveness match the derived facts"
