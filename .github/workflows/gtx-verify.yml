name: G.Tx verify generated output

on:
  push:
    branches:
      - 'gtx/**'
    paths:
      - 'gtx-out/**'
      - '.github/workflows/gtx-verify.yml'
  workflow_dispatch:

jobs:
  build-and-gate:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: gtx
          POSTGRES_DB: carddemo
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready --health-interval 5s
          --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Generated inventory
        run: |
          find gtx-out -type f | sort
          echo; cat gtx-out/db/SCHEMA_ANALYSIS.md || true

      - name: Build
        working-directory: gtx-out
        run: dotnet build GtxGenerated.csproj -c Release

      - name: Test (if any test project exists)
        working-directory: gtx-out
        run: |
          if ls tests/*.cs >/dev/null 2>&1; then
            dotnet test GtxGenerated.csproj -c Release --no-build --logger "console;verbosity=detailed"
          else
            echo "no tests yet - tests come from acceptance criteria in a later stage"
          fi

      # ---- MAINTAINABILITY GATES -------------------------------------------
      # The whole premise is that we re-implement in C#, not translate COBOL.
      # These make that a build failure rather than a promise. A .NET developer
      # must never need to read COBOL to maintain the output.

      - name: Gate - no COBOL storage vocabulary in generated code
        working-directory: gtx-out
        run: |
          if grep -rniE '\b(PIC +[SX9]|COMP-3|PACKED-DECIMAL|RECLN|FILLER|OCCURS|REDEFINES)\b' src/ db/migrations/*.sql ; then
            echo "::error::COBOL storage vocabulary found - the output is still COBOL-shaped"; exit 1
          fi
          echo "OK: no COBOL storage vocabulary"

      - name: Gate - no byte-layout concepts
        working-directory: gtx-out
        run: |
          if grep -rniE 'RecordLength|byte +offset|ReadOnlySpan<byte>|\boffset [0-9]+\b' src/ ; then
            echo "::error::byte-layout concepts found - target is PostgreSQL, not fixed-length records"; exit 1
          fi
          echo "OK: no byte-layout concepts"

      - name: Gate - no copybook-shaped type names
        working-directory: gtx-out
        run: |
          # e.g. Cvtra05yRecord, Cocom01yRecord - a copybook name is not a domain name
          if grep -rnE 'class +C[a-z]{4}[0-9]{2}[a-z]|record +C[a-z]{4}[0-9]{2}[a-z]' src/ ; then
            echo "::error::copybook-derived type name found"; exit 1
          fi
          echo "OK: no copybook-shaped type names"

      - name: Gate - no binary floating point on money
        working-directory: gtx-out
        run: |
          # Strip comments first: the design model writes notes like
          # "Money - decimal, never double", which are guidance, not violations.
          # Only a declaration or cast counts.
          if find src -name '*.cs' -print0 \
               | xargs -0 sed -E 's://.*::; s:/\*.*\*/::' \
               | grep -nE '(public|private|internal|protected)[[:space:]]+(double|float)[[:space:]]|\((double|float)\)' ; then
            echo "::error::binary floating point declaration found; money must be decimal"; exit 1
          fi
          echo "OK: no double/float declarations"

      - name: Gate - no API error payloads committed
        working-directory: gtx-out
        run: |
          if grep -rniE 'BadRequestError|invalid_request_error|credit balance is too low' . ; then
            echo "::error::provider error payload found in generated output"; exit 1
          fi
          echo "OK: no error payloads"

      # The most consequential gate: types are computed from the copybooks and the
      # design step may not change them. Added after the model silently turned an
      # alphanumeric TRAN-ID into a bigint, narrowed a varchar(50) to varchar(30),
      # dropped a column and invented another - none of which the gates above see.
      - name: Gate - migration applies to a real PostgreSQL
        working-directory: gtx-out/db
        env:
          FLYWAY_USER: postgres
          FLYWAY_PASSWORD: gtx
        run: |
          ls -1 migrations/
          # Generated SQL that has never been executed is not a deliverable. Apply
          # it to a real PostgreSQL with the same tool that will apply it on the
          # client's estate, then assert the schema history table records success.
          docker run --rm --network host \
            -v "$PWD/migrations:/flyway/sql" \
            -e FLYWAY_USER -e FLYWAY_PASSWORD \
            redgate/flyway:10 \
            -url=jdbc:postgresql://localhost:5432/carddemo \
            -locations=filesystem:/flyway/sql \
            -validateOnMigrate=true \
            -cleanDisabled=false \
            migrate
          PGPASSWORD=gtx psql -h localhost -U postgres -d carddemo -tAc \
            "select version||' '||script||' '||success from flyway_schema_history order by installed_rank"
          fail=$(PGPASSWORD=gtx psql -h localhost -U postgres -d carddemo -tAc \
            "select count(*) from flyway_schema_history where success is false")
          if [ "$fail" != "0" ]; then
            echo "::error::a migration was recorded as failed"; exit 1
          fi
          # The tables the model declares must actually exist afterwards.
          python3 - <<'EOF'
          import json, pathlib, subprocess, sys
          model = json.loads(pathlib.Path("../design/domain-model.json").read_text())
          want = sorted({e["table"] for e in model.get("entities") or []})
          out = subprocess.run(
              ["psql", "-h", "localhost", "-U", "postgres", "-d", "carddemo", "-tAc",
               "select table_name from information_schema.tables where table_schema='public'"],
              capture_output=True, text=True, env={"PGPASSWORD": "gtx", "PATH": "/usr/bin:/bin"})
          have = {l.strip() for l in out.stdout.splitlines() if l.strip()}
          missing = [t for t in want if t not in have]
          if missing:
              print("::error::migration applied but these tables are absent: %s" % missing)
              sys.exit(1)
          print("OK: migration applied; all %d modelled tables exist" % len(want))
          EOF

      - name: Gate - emitted code matches the model
        working-directory: gtx-out
        run: |
          python3 - <<'EOF'
          import json, re, pathlib, sys

          # The conformance gate checks the MODEL against the legacy facts. Nothing
          # checked the CODE against the model, so a bad render passed silently: a
          # relationship emitted beside the property holding the same column gave a
          # junk `long Card`, and renamed entities left orphan .cs files behind
          # because git_export never deletes what a previous run wrote. Both compiled.
          model = json.loads(pathlib.Path("design/domain-model.json").read_text())
          entities = model.get("entities") or []

          expected = set()
          for e in entities:
              expected.add(e["entity"])
              for o in e.get("owned") or []:
                  expected.add(o["type"])
              for x in e.get("enums") or []:
                  expected.add(x["type"])

          errors = []

          # 1. every emitted type is in the model, and every model type is emitted
          emitted = {f.stem for f in pathlib.Path("src").rglob("*.cs")
                     if not f.stem.endswith("DbContext")}
          for orphan in sorted(emitted - expected):
              errors.append("orphan file src/**/%s.cs is not in the model" % orphan)
          for missing in sorted(expected - emitted):
              errors.append("model type %s was never emitted" % missing)

          # 2. every property the model declares appears exactly once in its class
          for e in entities:
              path = next(pathlib.Path("src").rglob(e["entity"] + ".cs"), None)
              if path is None:
                  continue
              body = path.read_text()
              props = re.findall(r"public\s+[\w<>?.\[\]]+\s+(\w+)\s*{\s*get;", body)
              want = []
              if (e.get("key") or {}).get("property"):
                  want.append(e["key"]["property"])
              want += [p["property"] for p in (e.get("properties") or [])]
              want += [o["property"] for o in (e.get("owned") or [])]
              for w in want:
                  n = props.count(w)
                  if n == 0:
                      errors.append("%s.%s is in the model but not in the class" % (e["entity"], w))
                  elif n > 1:
                      errors.append("%s.%s declared %d times" % (e["entity"], w, n))
              for extra in set(props) - set(want) - {r.get("property") for r in (e.get("relationships") or [])}:
                  errors.append("%s.%s is in the class but not in the model" % (e["entity"], extra))

          # 3. no column mapped twice, in the DbContext or in the DDL
          ctx = next(pathlib.Path("src").rglob("*DbContext.cs"), None)
          if ctx:
              for block in re.split(r"b\.Entity<", ctx.read_text())[1:]:
                  ent = block.split(">")[0]
                  cols = re.findall(r'HasColumnName\("([^"]+)"\)', block.split("b.Entity<")[0])
                  dupes = {c for c in cols if cols.count(c) > 1}
                  for c in sorted(dupes):
                      errors.append("%s maps column %s more than once" % (ent, c))

          for table in re.findall(r"CREATE TABLE (\w+) \((.*?)\n\);",
                                  "\n".join(f.read_text() for f in sorted(pathlib.Path("db/migrations").glob("V*.sql"))), re.S):
              cols = re.findall(r"^\s{4}(\w+)\s", table[1], re.M)
              for c in sorted({c for c in cols if cols.count(c) > 1}):
                  errors.append("table %s declares column %s more than once" % (table[0], c))

          if errors:
              for e in errors:
                  print("::error::%s" % e)
              sys.exit(1)
          print("OK: emitted code matches the model exactly - %d types, no orphans, "
                "no duplicate properties or columns" % len(expected))
          EOF

      - name: Gate - conformance against derived facts
        working-directory: gtx-out
        run: |
          if [ ! -f CONFORMANCE.md ]; then
            echo "::error::CONFORMANCE.md missing - the conformance gate did not run"; exit 1
          fi
          cat CONFORMANCE.md
          # The emitter classifies every finding itself: a derived fact with a
          # citation, an architectural choice, or a blocking defect. Trust its
          # verdict instead of re-deriving it here from section headings that drift.
          if grep -q '^\*\*Status: BLOCKING' CONFORMANCE.md; then
            echo "::error::blocking conformance findings - see CONFORMANCE.md"
            sed -n '/^## \xe2\x9b\x94/,/^$/p' CONFORMANCE.md || true
            exit 1
          fi
          echo "OK: types match the copybooks; keys, dates and liveness match the derived facts"
