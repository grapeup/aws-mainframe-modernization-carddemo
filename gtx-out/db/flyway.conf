# Flyway configuration for the migrated schema.
#
# Plain SQL on purpose. A DBA can read every statement that will
# touch the database, and so can an auditor -- which matters more
# here than the convenience of generating migrations from the
# C# model.
#
# Override url/user/password per environment; never commit
# credentials.
flyway.url=jdbc:postgresql://localhost:5432/carddemo
flyway.user=${FLYWAY_USER}
flyway.password=${FLYWAY_PASSWORD}
flyway.locations=filesystem:migrations
flyway.baselineOnMigrate=false
flyway.validateOnMigrate=true
flyway.cleanDisabled=true
